protocol_version: acl-mindset-v2
method_name: mindset
implementation_version: v2
status: development_not_paper_frozen
seed: 0
benchmarks:
  locomo:
    path: data/locomo/locomo10.json
    manifest: data/manifests/locomo_standard1540.json
    expected_count: 1540
    include_categories: [1, 2, 3, 4]
  longmemeval:
    path: data/longmemeval/longmemeval_s_cleaned.json
    manifest: data/manifests/longmemeval_s500_instance_ids.json
    expected_count: 500
methods: [mindset, lightmem, zep, nemori, vector_rag, long_context]
primary_generator: qwen35_9b
construction_generator: qwen35_9b
# All six on the primary; strongest subset explicitly frozen before secondary runs.
generator_methods:
  qwen35_9b: [mindset, lightmem, zep, nemori, vector_rag, long_context]
  llama31_8b: [mindset, lightmem, zep, vector_rag]
  qwen35_4b: [mindset, lightmem, zep, vector_rag]
  llama32_3b: [mindset, lightmem, zep, vector_rag]
controllers: [energy, rule, learned, nearest]
ablations: [no_context, no_complexity, no_hysteresis, no_provenance]
mindset:
  profile: compact_v2
  # Selected on independent synthetic development, not benchmark answers.
  complexity_penalty: 0.10
  switch_margin: 0.20
  nearest_schema_k: 6
  retrieval_candidate_k: 48
  direct_pool_k: 24
  schema_pool_k: 24
  rerank_batch_size: 8
calibration:
  artifact: experiments/mindset/calibration_instance_ids.json
  learned_controller: experiments/mindset/learned_controller_instance_ids.json
  label_source: synthetic_ground_truth
  prohibition: no_test_question_or_history_tuning
retrieval:
  encoder: sentence-transformers/all-MiniLM-L6-v2
  reranker: cross-encoder/ms-marco-MiniLM-L6-v2
  device: cpu
  batch_size: 64
  candidate_k: 40
  top_k: 8
  # Native LightMem request; its unchanged implementation scores up to 2*k.
  lightmem_hits: 8
  chunk_tokens: 768
  overlap_tokens: 96
  evidence_tokens: 8000
# A fixed tokenizer freezes evidence independently of the answer generator.
evidence_tokenizer: qwen35_9b
generation:
  temperature: 0.0
  seed: 0
  max_output_tokens: 512
  common_context_tokens: 120000
  truncation: drop_oldest_whole_events
judge:
  model: gemini-3.1-flash-lite
  prompt_version: acl-published-judge-v2
  # An external published semantic-judge reference, NOT our ACL LightMem baseline.
  locomo_protocol: published_semantic_reference
  temperature: 0.0
  human_audit_fraction: 0.10
primary_metrics:
  locomo: native_f1
  longmemeval: judge_accuracy
efficiency:
  repetitions: 3
  cache_policy: disabled_per_repetition
  warmup_queries: 1
statistics:
  resamples: 10000
  locomo_unit: conversation
  longmemeval_unit: question
  alternative: two-sided
  correction: holm_within_benchmark_generator_metric_and_hypothesis_family
  prespecified_longmemeval_subsets: [knowledge-update, temporal-reasoning]
parameter_sweep:
  complexity_penalty: [0.10, 0.25, 0.40]
  switch_margin: [0.05, 0.10, 0.20]

